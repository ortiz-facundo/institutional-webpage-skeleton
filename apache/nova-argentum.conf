<VirtualHost *:80>
    ServerName nova-argentum.local
    ServerAlias localhost

    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    DirectoryIndex index.php

    ErrorLog ${APACHE_LOG_DIR}/nova-argentum-error.log
    CustomLog ${APACHE_LOG_DIR}/nova-argentum-access.log combined
</VirtualHost>
