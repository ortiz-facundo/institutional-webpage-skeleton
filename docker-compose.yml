services:
  php:
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8050}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mailer
  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8055}:8025"
  composer:
    image: composer:2
    volumes:
      - ./:/app
    working_dir: /app
    profiles: [tools]
    user: "${UID:-1000}:${GID:-1000}"
