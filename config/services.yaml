imports:
    - { resource: site.yaml }

services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude: '../src/Form/ContactInquiry.php'
    App\Mailer\ContactMailer:
        arguments:
            $senderAddress: '%env(CONTACT_MAIL_FROM)%'
            $senderName: '%env(CONTACT_MAIL_FROM_NAME)%'
            $recipientAddress: '%env(CONTACT_MAIL_TO)%'
            $recipientName: '%env(CONTACT_MAIL_TO_NAME)%'
            $siteName: '%site.name%'
            $transportDsn: '%env(CONTACT_MAIL_DSN)%'

when@test:
    services:
        App\Tests\Fixtures\ContactPreviewController:
            autowire: true
            autoconfigure: true
