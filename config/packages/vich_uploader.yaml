# Hand-written config for vich/uploader-bundle: its Flex recipe lives in
# the contrib repo and this project sets allow-contrib: false, so the
# recipe is never auto-applied (see composer require output). Add a new
# entry under `mappings` for each future upload field/entity.
vich_uploader:
    db_driver: orm
    mappings:
        avatar:
            uri_prefix: /uploads/avatars
            upload_destination: '%kernel.project_dir%/public/uploads/avatars'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
