framework:
    default_locale: en
    # Source-of-truth language. Symfony uses `default_locale` for the
    # translator's fallback (when a key is missing in the requested locale)
    # AND as the default request locale. The actual default request locale
    # for our app is Spanish; see LocaleResolver for the override and
    # AGENTS.md §"Internationalization" for the resolution order.
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['en']
        providers:
