security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserStateChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: admin_dashboard
                username_parameter: _email
                password_parameter: _password
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                csrf_token_id: logout
            # Impersonation / "log in as" — gated by the canonical
            # permission. The role check goes through the access decision
            # manager, so a user with PERMISSION_IMPERSONATE_USERS in
            # their roles (via the flattening in User::getRoles()) satisfies
            # the gate. Actual impersonation is started via
            # ImpersonateController::impersonate() (POST, CSRF-protected).
            switch_user:
                role:           PERMISSION_IMPERSONATE_USERS
                parameter:      _switch_user
                target_route:   admin_dashboard
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/login,             roles: PUBLIC_ACCESS }
        - { path: ^/account/confirm,  roles: PUBLIC_ACCESS }
        # Self-service profile page. Any logged-in user (incl. ROLE_USER-only
        # viewers) can see their own profile. No permission required — read-only.
        - { path: ^/account/profile,   roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin,             roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
