security:
    password_hashers:
        App\Entity\Administration\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Administration\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Service\Security\UserStateChecker
            form_login:
                login_path: security_login
                check_path: security_login
                enable_csrf: true
                default_target_path: backoffice_dashboard
                username_parameter: _email
                password_parameter: _password
            logout:
                path: security_logout
                target: security_login
                enable_csrf: true
                csrf_token_id: logout
            # Impersonation / "log in as" — gated by the canonical
            # permission. The role check goes through the access decision
            # manager, so a user with PERMISSION_IMPERSONATE_USERS in
            # their roles (via the flattening in User::getRoles()) satisfies
            # the gate. Actual impersonation is started via
            # ImpersonateController::impersonate() (POST, CSRF-protected).
            switch_user:
                role:           PERMISSION_IMPERSONATE_USERS
                parameter:      _switch_user
                target_route:   backoffice_dashboard
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/login,             roles: PUBLIC_ACCESS }
        - { path: ^/account/confirm,  roles: PUBLIC_ACCESS }
        # Self-service Profile & Settings page (hub + every section under it).
        # Any logged-in user (incl. ROLE_USER-only viewers) can see their own
        # profile and any section that they themselves are eligible for. No
        # permission required at the access-control level — per-section gating
        # is the controller's job (defence in depth).
        - { path: ^/account,           roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/dashboard,         roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin,             roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\Administration\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
