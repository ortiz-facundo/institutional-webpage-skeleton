monolog:
    channels: [contact]
    handlers:
        main:
            type: stream
            path: '%kernel.logs_dir%/%kernel.environment%.log'
            level: debug
            channels: ['!event', '!contact']
        contact:
            type: stream
            path: '%kernel.logs_dir%/contact.log'
            level: info
            channels: [contact]
when@prod:
    monolog:
        handlers:
            main:
                level: warning
