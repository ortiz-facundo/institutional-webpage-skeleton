# Enable stateless CSRF protection for forms and logins/logouts.
# `stateless_token_ids` lists every token id validated by Origin/Referer
# matching alone (no real token in the form — Symfony renders the literal
# "csrf-token" placeholder). Tokens outside this list use Symfony's
# normal session-backed token generator instead.
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - exit_impersonation
