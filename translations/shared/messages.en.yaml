# Shared module — English (source of truth).
#
# Cross-cutting strings that are reused by 2+ modules and don't fit
# any single module's namespace. Currently this is just the
# `state.<STATE>` labels (used by templates/_state_pill.html.twig and
# the UserType state selector) and a couple of generic errors.
#
# State values are the constant NAMES from App\Entity\Administration\User
# so the key is the same string the form submits and the entity stores.

app:
    shared:
        dismiss: 'Dismiss'
        state:
            USER_STATE_ACTIVE: 'Active'
            USER_STATE_PENDING: 'Pending'
            USER_STATE_DISABLED: 'Disabled'
        errors:
            not_found: 'Entity not found.'
            invalid_csrf: 'Invalid CSRF token.'
        sort:
            sort_by_aria: 'Sort by %column%'
            sorted_asc_aria: 'Sorted by %column% ascending — click to sort descending'
            sorted_desc_aria: 'Sorted by %column% descending — click to clear sort'
        pagination:
            aria: 'Pagination'
            previous_aria: 'Previous page'
            next_aria: 'Next page'
            showing: 'Showing %from%–%to% of %total%'
        custom_select:
            filter_placeholder: 'Filter…'
            filter_aria: 'Filter options'
            select_all: 'Select all'
            deselect_all: 'Deselect all'
        crud:
            add_row: 'Add row'
        tags:
            remove: 'Remove tag'
        phone:
            country: 'Country code'
            area: 'Area code'
            number: 'Phone number'
            preview: 'Preview'
