# Backoffice module — English (source of truth).
#
# Two areas:
#   1. `nav.*` — sidebar items (Dashboard / Users / Roles / Permissions),
#      the "Administration" group heading, sign-out, the "Settings" gear
#      aria-label.
#   2. `dashboard.*` — the dashboard h1 greeting, the tile subtitles,
#      the impersonation banner copy, the "Backoffice" base title.
#
# `app.backoffice` is used so the backoffice surface has a distinct key
# prefix from the rest of the `messages` domain.

app:
    backoffice:
        title: 'Backoffice'
        sign_out: 'Sign out'
        nav:
            dashboard: 'Dashboard'
            users: 'Users'
            roles: 'Roles'
            permissions: 'Permissions'
            administration: 'Administration'
            close_menu: 'Close menu'
            open_menu: 'Open menu'
        dashboard:
            welcome: 'Welcome, %name%'
            signed_in_as: 'Signed in as %email%'
            tile:
                users: 'Assign roles to backoffice users.'
                roles: 'Define which permissions each role grants.'
                permissions: 'Browse the permission catalog.'
        impersonation:
            active: 'Impersonation active.'
            as: 'You are acting as'
            original: 'originally'
            exit: 'Exit impersonation'
