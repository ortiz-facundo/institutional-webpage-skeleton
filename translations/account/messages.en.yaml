# Account module — English (source of truth).
#
# Six areas:
#   1. `app.account.profile.*` — the unified /account/profile-settings hub
#      h1 + subtitle (Profile & Settings), and the profile header card
#      (roles, account-state, no-roles placeholder).
#   2. `app.account.menu.*` — the settings menu groups (Security /
#      Preferences / Danger zone) and items, plus the disabled "soon"
#      badge and "Coming soon" tooltip.
#   3. `app.account.edit_profile.*` — the profile-photo hover pencil/cross
#      widget on the hub's avatar (account/_profile_header.html.twig +
#      assets/js/avatar-editor.js): icon aria-labels, the crop dialog, the
#      delete-confirm dialog, and the controller's flash messages. Not a
#      page of its own — EditProfileController is POST-only.
#   4. `app.account.change_password.*` — the change-password section page
#      title, description, submit, back link, and the controller's flash
#      messages.
#   5. `app.account.locale.*` — the language switcher (label, options,
#      saved flash).
#
# `index.settings` + `index.select_hint` are the hub h2 + helper line.

app:
    account:
        profile:
            title: 'Profile & Settings'
            subtitle: 'Your identity and configuration.'
            header:
                roles: 'Roles'
                state: 'Account state'
                no_roles: 'No roles assigned'
        menu:
            group:
                security: 'Security'
                preferences: 'Preferences'
                danger_zone: 'Danger zone'
            item:
                change_password: 'Change password'
                active_sessions: 'Active sessions'
                two_factor: 'Two-factor authentication'
                locale: 'Language'
                notifications: 'Notifications'
                disable_account: 'Disable account'
            soon: 'soon'
            coming_soon: 'Coming soon'
        index:
            settings: 'Settings'
            select_hint: 'Select a config item below.'
        edit_profile:
            photo:
                edit: 'Edit photo'
                remove: 'Remove photo'
                remove_confirm:
                    title: 'Remove profile photo?'
                    description: "This can't be undone. You'll need to upload a new photo to set one again."
                    confirm: 'Remove'
            crop:
                title: 'Crop your photo'
                description: 'Drag to reposition, use the slider to zoom.'
                zoom: 'Zoom'
                cancel: 'Cancel'
                save: 'Save'
            flash:
                updated: 'Profile photo updated.'
                removed: 'Profile photo removed.'
        change_password:
            title: 'Change password'
            description: "Pick a new password. You'll need to enter your current one to confirm."
            submit: 'Update password'
            back: 'Back to settings'
        flash:
            password_updated: 'Password updated.'
            password_incorrect: 'Current password is incorrect.'
        locale:
            title: 'Language'
            description: 'Choose the language used across the backoffice, account settings, and emails.'
            label: 'Language'
            options:
                en: 'English'
                es: 'Spanish'
            saved: 'Language updated.'
            save: 'Save language'
